
<html>
    <style>
         /* Modal background */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(10, 20, 40, 0.8);
  backdrop-filter: blur(4px);
  overflow-y: auto;
}

/* Modal content box */
.modal-content {
  background: #ffffff;
  margin: 5% auto;
  padding: 25px 35px;
  border-radius: 16px;
  width: 90%;
  max-width: 750px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
  position: relative;
  border-top: 6px solid #007bff; /* Blue accent */
  animation: fadeIn 0.4s ease;
}

/* Title */
.modal-content h2 {
  text-align: center;
  color: #004aad;
  font-weight: 700;
  font-size: 1.5rem;
  margin-bottom: 10px;
  border-bottom: 2px solid #ff7b00;
  padding-bottom: 8px;
}

/* Section headings */
form h3 {
  margin-top: 20px;
  color: #004aad;
  font-size: 1.1rem;
  font-weight: 600;
  border-left: 4px solid #ff7b00;
  padding-left: 10px;
  margin-bottom: 10px;
}

/* Close button */
.close-btn {
  position: absolute;
  top: 12px;
  right: 18px;
  font-size: 28px;
  cursor: pointer;
  color: #004aad;
  transition: 0.3s;
}

.close-btn:hover {
  color: #ff7b00;
}

/* Input and select */
input, select, textarea {
  width: 100%;
  padding: 10px;
  border: 1.5px solid #d0d0d0;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: 0.25s ease;
}

input:focus, select:focus, textarea:focus {
  border-color: #007bff;
  box-shadow: 0 0 6px rgba(0, 123, 255, 0.3);
}

/* Form group layout */
.form-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 14px;
}

.form-row {
  display: flex;
  gap: 15px;
}

.form-row .form-group {
  flex: 1;
}

/* Checkbox group */
/* Fix checkbox alignment and style */
.checkbox-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 25px;
  margin: 12px 0 20px 0;
}

.checkbox-group label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  color: #333;
  background: #f8f9fc;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid #e2e6ea;
  transition: 0.2s ease;
  cursor: pointer;
}

.checkbox-group label:hover {
  background: rgba(0, 123, 255, 0.05);
  border-color: #007bff;
}

.checkbox-group input[type="checkbox"] {
  accent-color: #ff7b00; /* orange accent for the tick */
  width: 18px;
  height: 18px;
  cursor: pointer;
  flex-shrink: 0;
  transform: translateY(0); /* centers perfectly */
}

/* Responsive spacing */
@media (max-width: 600px) {
  .checkbox-group {
    flex-direction: column;
    gap: 8px;
  }
}


/* Buttons */
.submit-btn {
  display: block;
  margin: 20px auto 10px auto;
  background: linear-gradient(90deg, #007bff, #ff7b00);
  color: white;
  border: none;
  padding: 12px 28px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: 0.3s ease;
}

.submit-btn:hover {
  transform: scale(1.03);
  background: linear-gradient(90deg, #005fcc, #ff6a00);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

/* Label styling */
label {
  font-weight: 500;
  color: #333;
  margin-bottom: 4px;
}

/* Animation for fade in */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Scrollbar */
.modal-content::-webkit-scrollbar {
  width: 8px;
}
.modal-content::-webkit-scrollbar-thumb {
  background-color: #007bff;
  border-radius: 8px;
}
    </style>
    
    <body><!-- ===== Form Modal Component ===== -->
<div id="gatewayFormModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" id="closeFormBtn">&times;</span>
    <h2>Gateway Software Solutions - Enquiry Form</h2>

    <form id="gatewayForm"> <h3>Personal Details</h3> <div class="form-group"> <label>Name</label> <input type="text" name="name" required> </div> <div class="form-group"> <label>Address</label> <input type="text" name="address"> </div> <div class="form-row"> <div class="form-group"> <label>Father’s Name</label> <input type="text" name="fatherName"> </div> <div class="form-group"> <label>D.O.B</label> <input type="date" name="dob"> </div> </div> <div class="form-row"> <div class="form-group"> <label>Age</label> <input type="number" name="age"> </div> <div class="form-group"> <label>Sex</label> <select name="sex"> <option>Male</option> <option>Female</option> <option>Other</option> </select> </div> </div> <h3>Education Details</h3> <div class="form-row"> <div class="form-group"> <label>College Name</label> <input type="text" name="collegeName"> </div> <div class="form-group"> <label>Candidate Degree</label> <input type="text" name="degree"> </div> </div> <div class="form-row"> <div class="form-group"> <label>Year of Pass Out</label> <input type="text" name="passoutYear"> </div> <div class="form-group"> <label>Technical Skills</label> <input type="text" name="skills" placeholder="e.g. Java, Python, React"> </div> </div> <h3>Requirement</h3> <div class="checkbox-group"> <label><input type="checkbox" name="requirement" value="Training"> Training</label> <label><input type="checkbox" name="requirement" value="Internship/Training"> Internship/Training</label> <label><input type="checkbox" name="requirement" value="Live Project Training"> Live Project Training</label> <label><input type="checkbox" name="requirement" value="Placement Support"> Placement Support</label> <label><input type="checkbox" name="requirement" value="Project Development"> Project Development</label> </div> <h3>Category / Position</h3> <div class="checkbox-group"> <label><input type="checkbox" name="position" value="Web Development"> Web Development</label> <label><input type="checkbox" name="position" value="Digital Marketing/SEO"> Digital Marketing / SEO</label> <label><input type="checkbox" name="position" value="HR Internship"> HR Internship</label> <label><input type="checkbox" name="position" value="Embedded/C C++"> Embedded / C / C++</label> <label><input type="checkbox" name="position" value="Python/DS"> Python / Data Science</label> </div> <h3>Area of Interest</h3> <input type="text" name="interest" placeholder="Your area of interest"> <h3>References</h3> <textarea name="references" rows="2" placeholder="Any references or how did you hear about us?"></textarea> <button type="submit" class="submit-btn">Submit</button> </form>
  </div>
</div>
</body>
<script>
  const modal = document.getElementById("gatewayFormModal");
  const openBtn = document.getElementById("openFormBtn");
  const closeBtn = document.getElementById("closeFormBtn");

  if (openBtn) {
    openBtn.onclick = function (e) {
      e.preventDefault();
      modal.style.display = "block";
    };
  }

  if (closeBtn) {
    closeBtn.onclick = function () {
      modal.style.display = "none";
    };
  }

  window.onclick = function (e) {
    if (e.target == modal) {
      modal.style.display = "none";
    }
  };

  document.getElementById("gatewayForm").addEventListener("submit", function (e) {
    e.preventDefault();
    alert("Form submitted successfully!");
    modal.style.display = "none";
  });
</script>
</html>
